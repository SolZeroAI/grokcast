name: Validate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Tegami version pull request changes only release files, and the pull requests it
# releases already ran CI. Every job skips on it. It is known by its branch and the
# release GitHub App that opens it.
jobs:
  validate:
    name: Typecheck, lint, format, and test
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'tegami/version-packages' && github.event.pull_request.user.login == 'solzero-bot[bot]') && github.event.pull_request.draft != true }}
    # Public repository: GitHub-hosted runners are free.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: "0.9.6"
          node-version-file: .nvmrc
          cache-dependency-path: package-lock.json

      - name: Install
        run: nub install --frozen-lockfile

      - name: Typecheck
        run: nub run typecheck

      - name: Lint
        run: nub run lint

      - name: Check formatting
        run: nub run format

      - name: Test
        run: nub run test

      # Validates the manifest, the Store author, and the icons, the same way the Raycast Store does.
      - name: Validate the Raycast manifest
        run: npx ray lint --non-interactive

  changes:
    name: Detect build changes
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'tegami/version-packages' && github.event.pull_request.user.login == 'solzero-bot[bot]') && github.event.pull_request.draft != true }}
    # Public repository: GitHub-hosted runners are free.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.build.outputs.build }}
    steps:
      # A pull request runs the macOS build only when it changes a file `ray build` reads.
      # Pushes to master and manual runs always build.
      - name: Check changed files
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          build=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')"
            if ! printf '%s\n' "$files" | grep -qE '^(src/|recorder/|assets/|package\.json$|package-lock\.json$|tsconfig\.json$|\.nvmrc$|scripts/store-publish\.mts$|\.github/workflows/validate\.yml$)'; then
              build=false
              echo "No build inputs changed, so the macOS build does not run."
            fi
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"

  build:
    name: Build the extension and the Swift recorder
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # The recorder in recorder/ needs macOS and Xcode 16.3 or later, like the Raycast Store build.
    # GitHub-hosted macos-15 provides Xcode 16.4 as its default.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: "0.9.6"
          node-version-file: .nvmrc
          cache-dependency-path: package-lock.json

      - name: Install
        run: nub install --frozen-lockfile

      - name: Show the Xcode version
        run: xcodebuild -version

      # `ray build` compiles recorder/, type-checks with the generated raycast-env.d.ts, and bundles each command.
      - name: Build the extension
        run: npx ray build --environment dist --non-interactive

      - name: Check that the recorder was built
        run: test -x assets/compiled_raycast_swift/recorder

      # Builds and lints the staging folder that `nub run publish` sends to the Store,
      # and lists its files, so a missing or extra Store file shows up here.
      - name: Check the Store copy
        run: nub run store:check
