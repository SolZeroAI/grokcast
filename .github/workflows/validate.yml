name: Validate

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, format, and test
    # SolZeroAI's self-hosted arm64 Linux runners (mayflower).
    runs-on: [self-hosted, arm64, linux]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup nub
        uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          nub-version: "0.9.6"
          node-version-file: .node-version
          cache-dependency-path: package-lock.json

      - name: Install
        run: nub install --frozen-lockfile

      - name: Typecheck
        run: nub run typecheck

      - name: Lint
        run: nub run lint

      - name: Check formatting
        run: nub run format

      - name: Test
        run: nub run test

      # Validates the manifest, the Store author, and the icons, the same way the Raycast Store does.
      - name: Validate the Raycast manifest
        run: npx ray lint --non-interactive

  build:
    name: Build the extension and the Swift recorder
    # The recorder in recorder/ needs macOS and Xcode 16.3 or later, like the Raycast Store build.
    # SolZeroAI's self-hosted macOS runners (mayflower), which carry Xcode.
    runs-on: [self-hosted, arm64, macos]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup nub
        uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          nub-version: "0.9.6"
          node-version-file: .node-version
          cache-dependency-path: package-lock.json

      - name: Install
        run: nub install --frozen-lockfile

      - name: Show the Xcode version
        run: xcodebuild -version

      # `ray build` compiles recorder/, type-checks with the generated raycast-env.d.ts, and bundles each command.
      - name: Build the extension
        run: npx ray build --environment dist --non-interactive

      - name: Check that the recorder was built
        run: test -x assets/compiled_raycast_swift/recorder
