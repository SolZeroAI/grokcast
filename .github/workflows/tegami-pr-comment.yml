name: Tegami PR Comment

on:
  workflow_run:
    workflows:
      - Tegami PR Preview
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  # Picks a runner for each pool from the org ROUTACT_CONFIG (SolZeroAI/routact).
  route:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # The route job reads runners with its own App token, so it needs no workflow token.
    permissions: {}
    uses: SolZeroAI/routact/.github/workflows/route.yml@master
    with:
      pools: light
    secrets: inherit

  comment:
    name: Post release preview
    needs: route
    runs-on: ${{ fromJson(needs.route.outputs.runners)['light'] }}
    timeout-minutes: 10
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup nub
        uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          nub-version: "0.9.6"
          node-version-file: .node-version
          cache-dependency-path: package-lock.json

      - name: Install
        run: nub install --frozen-lockfile

      - name: Download release preview
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tegami-pr-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post release preview
        run: nub run tegami pr comment tegami-pr-preview.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
