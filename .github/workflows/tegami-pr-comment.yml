name: Tegami PR Comment

on:
  workflow_run:
    workflows:
      - Tegami PR Preview
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Post release preview
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # SolZeroAI's self-hosted arm64 Linux runners (mayflower).
    runs-on: [self-hosted, arm64, linux]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: "0.9.6"
          node-version-file: .nvmrc
          cache-dependency-path: package-lock.json

      - name: Install
        run: nub install --frozen-lockfile

      - name: Download release preview
        uses: actions/download-artifact@v8
        with:
          name: tegami-pr-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post release preview
        run: nub run tegami pr comment tegami-pr-preview.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
