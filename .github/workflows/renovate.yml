name: Renovate

# The shared preset and workflow live in SolZeroAI/renovate-config.
# A push that changes dependencies runs Renovate again, so it rebuilds
# the dependency pull requests that now conflict on package-lock.json.
on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [master]
    paths:
      - "**/package.json"
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    uses: SolZeroAI/renovate-config/.github/workflows/renovate.yml@master
    secrets: inherit
    with:
      runs-on: '["self-hosted","arm64","linux"]'
