name: Release

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  # Picks a runner for each pool from the org ROUTACT_CONFIG (SolZeroAI/routact).
  route:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # The route job reads runners with its own App token, so it needs no workflow token.
    permissions: {}
    uses: SolZeroAI/routact/.github/workflows/route.yml@master
    with:
      pools: light
    secrets: inherit

  release:
    name: Version with Tegami
    needs: route
    runs-on: ${{ fromJson(needs.route.outputs.runners)['light'] }}
    timeout-minutes: 15
    steps:
      # The app opens tegami/version-packages, so pull_request workflows start.
      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # Credentials stay in the checkout so the release tag push uses this token.
          token: ${{ steps.release-token.outputs.token }}

      - name: Setup nub
        uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          nub-version: "0.9.6"
          node-version-file: .node-version
          cache-dependency-path: package-lock.json

      - name: Install
        run: nub install --frozen-lockfile

      - name: Version or publish
        run: nub run tegami ci
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
